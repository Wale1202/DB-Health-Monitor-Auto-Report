name: DB Health Check

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  healthcheck:
    runs-on: ubuntu-latest

    steps:
     - name: Checkout code
       uses: actions/checkout@v4

     - name: Set up Python
       uses: actions/setup-python@v5
       with:
         python-version: "3.12"

     - name: Install dependencies
       run: pip install psycopg
    
     - name: Run health check
       env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          CONNECT_TIMEOUT_SECONDS: "5"
       run: |
          mkdir -p reports
          python src/healthcheck.py --outdir reports

     - name: Upload to S3
       env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
       run: |
          TIMESTAMP=$(date -u +%Y-%m-%d/%H%M%S)
          aws s3 cp reports/report.json "s3://${{ secrets.S3_BUCKET_NAME }}/reports/$TIMESTAMP/report.json"
          aws s3 cp reports/report.txt "s3://${{ secrets.S3_BUCKET_NAME }}/reports/$TIMESTAMP/report.txt"
      